name: find-evil-sleuth

services:
  postgres:
    build:
      context: ./postgres
    image: find-evil-sleuth/postgres:17
    container_name: sleuth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:        ${PG_DB:-sleuth}
      POSTGRES_USER:      ${PG_USER:-sleuth}
      POSTGRES_PASSWORD:  ${PG_PASSWORD:-changeme-dev-only}
    ports:
      - "${PG_PORT:-5532}:5432"
    volumes:
      - sleuth_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-sleuth} -d ${PG_DB:-sleuth}"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  sleuth_pgdata:
    name: sleuth_pgdata
