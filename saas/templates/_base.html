<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-950 text-gray-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}find-evil-sleuth inspector{% endblock %}</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js" defer></script>
</head>
<body class="h-full flex flex-col font-mono">

  <nav class="bg-gray-900 border-b border-green-700 px-6 py-3 flex items-center gap-8">
    <span class="text-green-400 font-bold tracking-wider text-lg">&#x25B6; find-evil-sleuth</span>
    <a href="/" class="text-gray-300 hover:text-green-400 transition-colors">Cases</a>
    <a href="/console" class="text-gray-300 hover:text-green-400 transition-colors">Console</a>
  </nav>

  <main class="flex-1 overflow-auto p-6">
    {% block content %}
    <div class="text-green-400">
      <p class="text-xl font-bold mb-2">Inspector SaaS — online</p>
      <p class="text-gray-400 text-sm">Select a case from the <a href="/" class="text-green-400 underline">Cases</a> list or query the <a href="/console" class="text-green-400 underline">Console</a>.</p>
    </div>
    {% endblock %}
  </main>

  <footer class="bg-gray-900 border-t border-gray-800 px-6 py-2 text-xs text-gray-600 flex justify-between">
    <span>find-evil-sleuth &mdash; SANS Hackathon 2026</span>
    <span>port 8932</span>
  </footer>

</body>
</html>
