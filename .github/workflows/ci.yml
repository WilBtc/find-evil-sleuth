name: ci
on: [push, pull_request]
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax (ADWs + scripts)
        run: |
          python3 -m compileall -q adws scripts
      - name: Shell syntax (scripts)
        run: |
          for f in scripts/*.sh; do bash -n "$f" && echo "ok $f"; done
      - name: Required compliance files present
        run: |
          for f in LICENSE README.md docs/ACCURACY.md docs/architecture.svg docs/EVIDENCE.md; do
            test -e "$f" && echo "ok $f" || { echo "MISSING $f"; exit 1; }
          done
